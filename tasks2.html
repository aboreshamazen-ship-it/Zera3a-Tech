<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgroHire | منصة الزراعة الذكية</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Fonts -->
    <link
        href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800;900&family=Poppins:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">

    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        :root {
            --agro-teal: #0F4C5C;
            --agro-sand: #E6D5B8;
            --agro-orange: #E07A5F;
            --agro-offwhite: #FAF9F6;

            --agro-primary: var(--agro-teal);
            --agro-dark: var(--agro-teal);
            --agro-bg: var(--agro-offwhite);
            --agro-accent: var(--agro-orange);
            --agro-card: #ffffff;
            --agro-text: var(--agro-teal);
            --agro-text-muted: #71717a;
        }

        html.dark {
            --agro-bg: #0A0F12;
            --agro-dark: #ffffff;
            --agro-card: #121A1E;
            --agro-text: #E2E8F0;
            --agro-text-muted: #94a3b8;
            --agro-sand: #2A2F33;
        }

        body {
            font-family: 'Cairo', sans-serif;
            background-color: var(--agro-bg);
            color: var(--agro-text);
            margin: 0;
            overflow-x: hidden;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        body.hidden {
            display: none;
        }

        .loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: var(--agro-bg);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 99999;
            transition: opacity 0.5s ease;
        }

        .loading-screen.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .spinner {
            width: 80px;
            height: 80px;
            border: 8px solid rgba(224, 122, 95, 0.1);
            border-top: 8px solid #E07A5F;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        .bg-agro-bg {
            background-color: var(--agro-bg);
        }

        .bg-agro-card {
            background-color: var(--agro-card);
        }

        .text-agro-dark {
            color: var(--agro-dark);
        }

        .text-agro-text {
            color: var(--agro-text);
        }

        .text-agro-text-muted {
            color: var(--agro-text-muted);
        }

        .border-agro-border {
            border-color: rgba(128, 128, 128, 0.1);
        }

        .serif-font {
            font-family: 'Poppins', sans-serif;
        }

        .animate-fade-in {
            animation: fadeIn 0.6s ease-out forwards;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .custom-scrollbar::-webkit-scrollbar {
            width: 4px;
        }

        .custom-scrollbar::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.05);
        }

        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: var(--agro-teal);
            border-radius: 10px;
        }
    </style>
</head>

<body class="hidden">
    <!-- Loading Screen -->
    <div id="loading-screen" class="loading-screen">
        <div class="spinner"></div>
        <p class="text-2xl font-black text-[#E07A5F] animate-pulse">AgroHire</p>
        <p class="text-sm font-bold text-agro-text-muted mt-4">جاري التحقق من الصلاحيات...</p>
    </div>

    <div id="root"></div>

    <script type="text/babel">
        // --- Mock Data Generator (نفس الكود السابق) ---
        const generateWorkers = (count = 27) => {
            const namesAr = [
                "أحمد محمود", "محمد علي", "محمود حسن", "علي إبراهيم", "سيد عبد الله",
                "إبراهيم صلاح", "صلاح الدين", "حسن يوسف", "حسين جابر", "عبد الله كمال",
                "زياد طارق", "ياسر شريف", "خالد وليد", "عمر الفاروق", "طارق يحيى",
                "سامح نبيل", "هاني رمزي", "مصطفى كامل", "مجدي يعقوب", "رفعت إسماعيل",
                "كمال الشناوي", "سعيد صالح", "جابر عصفور", "عوض محمد", "فتحي غانم",
                "شريف منير", "عزت أبو عوف"
            ];

            const namesEn = [
                "Ahmed Mahmoud", "Mohamed Ali", "Mahmoud Hassan", "Ali Ibrahim", "Sayed Abdullah",
                "Ibrahim Salah", "Salah El-Din", "Hassan Youssef", "Hussein Gaber", "Abdullah Kamal",
                "Ziad Tarek", "Yasser Sherif", "Khaled Walid", "Omar El-Farouk", "Tarek Yehia",
                "Sameh Nabil", "Hany Ramzy", "Mustafa Kamel", "Magdy Yacoub", "Refaat Ismail",
                "Kamal El-Shennawy", "Said Saleh", "Gaber Asfour", "Awad Mohamed", "Fathy Ghanem",
                "Sherif Mounir", "Ezzat Abu Auf"
            ];

            const regionsAr = ["الجيزة", "أسيوط", "المنوفية", "الدقهلية", "البحيرة", "الفيوم", "سوهاج", "الإسماعيلية", "الأقصر", "القليوبية"];
            const regionsEn = ["Giza", "Asyut", "Monofiya", "Dakahlia", "Beheira", "Fayoum", "Sohag", "Ismailia", "Luxor", "Qalyubia"];

            const jobs = ["سائق جرار", "خبير ري", "حصاد محاصيل", "فني صوبات", "مشرف ميداني", "صيانة معدات", "خبير وقاية نبات", "فني لاندسكيب"];
            const jobsEn = ["Tractor Driver", "Irrigation Expert", "Harvest Specialist", "Greenhouse Tech", "Field Supervisor", "Equipment Maint.", "Plant Protection", "Landscape Tech"];
            const skillsList = [["حرث", "ري حديث"], ["حصاد", "تعبئة"], ["تسميد", "وقاية"], ["تصريف", "تقليم"], ["توجيه", "إشراف"], ["تشخيص أمراض", "مكافحة"]];
            const skillsEn = [["Plowing", "Modern Irrigation"], ["Harvest", "Packing"], ["Fertilizing", "Protection"], ["Drainage", "Pruning"], ["Leadership", "Oversight"], ["Diagnosis", "Control"]];

            const biosAr = [
                "خبير في التعامل مع المحاصيل الاستراتيجية وإدارة فرق الحصاد الكبرى بكفاءة عالية.",
                "متخصص في أنظمة الري الحديثة وصيانة الشبكات لضمان أقصى كفاءة مائية للمزرعة.",
                "فني محترف في تجهيز الصوبات الزراعية وحماية المحاصيل من الآفات الموسمية.",
                "مشرف ميداني ذو خبرة واسعة في تخطيط المهام اليومية ومتابعة معايير الجودة.",
                "سائق محترف للمعدات الثقيلة مع دراية تامة بأساليب الحرث العميق وتجهيز التربة.",
                "خبير في برامج التسميد العضوي والكيماوي لزيادة إنتاجية الفدان بطرق آمنة."
            ];

            const biosEn = [
                "Expert in handling strategic crops and efficiently managing large harvest teams.",
                "Specialist in modern irrigation systems and network maintenance for maximum water efficiency.",
                "Professional technician in greenhouse preparation and seasonal pest protection.",
                "Field supervisor with extensive experience in planning tasks and quality monitoring.",
                "Professional heavy equipment driver with full knowledge of deep plowing methods.",
                "Expert in organic and chemical fertilization programs to increase safe productivity."
            ];

            return Array.from({ length: count }, (_, i) => {
                const jobIdx = i % jobs.length;
                const regionIdx = i % regionsAr.length;
                const skillIdx = i % skillsList.length;
                const bioIdx = i % biosAr.length;
                const nameIdx = i % namesAr.length;
                const price = 250 + ((i % 10) * 20);

                return {
                    id: i + 1,
                    name: namesAr[nameIdx],
                    nameEn: namesEn[nameIdx],
                    job: jobs[jobIdx],
                    jobEn: jobsEn[jobIdx],
                    rating: 4.5 + (Math.random() * 0.5),
                    reviews: 10 + Math.floor(Math.random() * 120),
                    price: price,
                    location: regionsAr[regionIdx],
                    locationEn: regionsEn[regionIdx],
                    img: [
                        "https://i.pinimg.com/1200x/6a/d1/57/6ad157c8278e090a7151341adc8eaaa6.jpg",
                        "https://i.pinimg.com/736x/52/43/2b/52432bd24fcb9087ce0c392320f067a5.jpg",
                        "https://i.pinimg.com/1200x/2c/e3/98/2ce398b6e5a2999258f2327bbbb72a73.jpg",
                        "https://i.pinimg.com/736x/a6/80/74/a68074a753c3549cd8050bd1811063ba.jpg",
                        "https://i.pinimg.com/1200x/01/c4/3b/01c43bbb39cf74d24c9190d4832a080c.jpg",
                        "https://i.pinimg.com/736x/58/80/94/5880947a46b1bc24324af9b70ff77900.jpg",
                        "https://i.pinimg.com/1200x/55/06/62/55066253d0d056c690cfb49f4f91ff82.jpg",
                        "https://i.pinimg.com/736x/50/1d/f1/501df15ed64623ab3b8054eb2b9bb0d0.jpg",
                        "https://i.pinimg.com/736x/67/d4/73/67d473ac5acd3069d909813c79d55942.jpg",
                    ][i % 9],
                    isVip: i % 5 === 0,
                    experience: 3 + (i % 12),
                    completionRate: 90 + (i % 10),
                    skills: skillsList[skillIdx],
                    skillsEn: skillsEn[skillIdx],
                    isVerified: true,
                    projectsCount: 20 + (i * 3),
                    isAvailable: i % 4 !== 0,
                    bio: biosAr[bioIdx],
                    bioEn: biosEn[bioIdx]
                };
            });
        };

        const workersData = generateWorkers(27);

        // --- Components ---

        const TreeSilhouette = () => {
            return (
                <div className="absolute inset-0 w-full h-full overflow-hidden select-none pointer-events-none z-0">
                    <svg viewBox="0 0 1440 400" preserveAspectRatio="none" className="absolute bottom-0 left-0 w-full h-[300px] opacity-20">
                        <path fill="#0F4C5C" opacity="0.2" d="M0,400 L0,320 C100,280 200,340 300,300 S500,260 650,320 S850,240 1000,310 S1250,280 1440,330 L1440,400 Z" />
                        <path fill="#5DAE66" opacity="0.1" d="M0,400 L0,360 Q50,320 100,350 T200,330 T300,360 T400,310 T500,360 T600,300 T700,370 T800,310 T900,380 T1000,320 T1100,370 T1200,300 T1300,375 T1440,340 L1440,400 Z" />
                    </svg>
                </div>
            );
        };

        const Footer = ({ lang }) => {
            return (
                <footer className="mt-auto py-16 px-8 bg-agro-card border-t border-gray-100 dark:border-white/5 transition-colors duration-300">
                    <div className={`max-w-7xl mx-auto flex flex-col md:flex-row justify-between items-center gap-10 ${lang === 'ar' ? '' : 'flex-row-reverse'}`}>
                        <div className={`flex items-center gap-4 ${lang === 'en' ? 'flex-row-reverse' : ''}`}>
                            <div className="w-12 h-12 bg-[#5DAE66] rounded-2xl flex items-center justify-center shadow-lg">
                                <i className="fas fa-leaf text-white text-xl"></i>
                            </div>
                            <span className="text-2xl font-black tracking-tighter serif-font text-agro-dark">AgroHire</span>
                        </div>
                        <div className="flex gap-4">
                            {['facebook', 'instagram', 'linkedin', 'twitter'].map(i => (
                                <a key={i} href="#" className="w-12 h-12 rounded-2xl bg-agro-bg flex items-center justify-center text-agro-text-muted hover:text-[#E07A5F] hover:bg-white dark:hover:bg-white/10 transition-all shadow-sm">
                                    <i className={`fab fa-${i} text-lg`}></i>
                                </a>
                            ))}
                        </div>
                        <div className="text-[11px] font-black uppercase tracking-[0.4em] text-agro-text-muted">
                            <p>{lang === 'ar' ? '© 2024 AGROHIRE. جميع الحقوق محفوظة.' : '© 2024 AGROHIRE. ALL RIGHTS RESERVED.'}</p>
                        </div>
                    </div>
                </footer>
            );
        };

        const Header = ({ activePage, onPageChange, isDarkMode, toggleDarkMode, lang, toggleLanguage }) => {
            const labels = {
                ar: { home: 'الرئيسية', backHome: 'العودة للرئيسية' },
                en: { home: 'Home', backHome: 'Back to Home' }
            };
            const t = labels[lang];

            // ✅ تعديل زر العودة للرئيسية حسب الـ Role
            const handleBackToHome = () => {
                // ✅ إذا كان المستخدم فلاح، يروح لصفحة الفلاح
                if (window.userRole === 'farmer') {
                    window.location.href = './farmer-ar.html';
                }
                // ✅ إذا كان مستثمر أو أي دور آخر، يروح للصفحة الرئيسية
                else {
                    onPageChange('home');
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                }
            };

            return (
                <header className="fixed top-0 w-full z-[100] px-6 md:px-12 py-6 pointer-events-none">
                    <div className={`max-w-screen-2xl mx-auto flex items-center justify-between pointer-events-auto ${lang === 'en' ? 'flex-row' : 'flex-row-reverse'}`}>
                        <div className={`flex items-center gap-3 ${lang === 'en' ? 'flex-row' : 'flex-row-reverse'}`}>
                            <button onClick={toggleLanguage} className="bg-[#0F4C5C] text-white px-6 py-3 rounded-2xl text-[12px] font-black uppercase shadow-2xl hover:bg-[#E07A5F] transition-all flex items-center gap-3 border-2 border-white/20">
                                <i className="fas fa-globe text-sm"></i>
                                {lang === 'ar' ? 'English' : 'عربي'}
                            </button>
                            <button onClick={toggleDarkMode} className={`w-12 h-12 rounded-2xl flex items-center justify-center transition-all shadow-2xl border-2 ${isDarkMode ? 'bg-white text-[#0F4C5C] border-[#0F4C5C]/10' : 'bg-[#0F4C5C] text-white border-white/20'} hover:scale-105 active:scale-95`}>
                                <i className={`fas ${isDarkMode ? 'fa-sun' : 'fa-moon'} text-lg`}></i>
                            </button>
                        </div>
                        <div className={`flex items-center bg-white/95 dark:bg-black/40 backdrop-blur-xl rounded-[28px] p-1.5 border-2 border-gray-100 dark:border-white/10 shadow-2xl ${lang === 'en' ? 'flex-row-reverse' : 'flex-row'}`}>
                            <button onClick={handleBackToHome} className={`flex items-center gap-3 px-6 py-3.5 rounded-2xl transition-all group active:scale-95 bg-[#E07A5F] text-white shadow-lg hover:shadow-orange-500/30 ${lang === 'ar' ? 'ml-2' : 'mr-2'}`}>
                                <i className="fas fa-home transition-transform group-hover:-translate-y-0.5"></i>
                                <span className="text-[11px] font-black uppercase tracking-wider">{t.backHome}</span>
                            </button>
                            <div className={`flex items-center gap-3 cursor-pointer group px-4 py-2 rounded-2xl ${lang === 'en' ? 'flex-row-reverse' : 'flex-row'}`} onClick={handleBackToHome}>
                                <span className="text-xl md:text-2xl font-black tracking-tighter text-[#0F4C5C] dark:text-white serif-font">Zera3a<span className="text-[#E07A5F]">Tech</span></span>
                                <div className="w-9 h-9 bg-[#E07A5F] rounded-xl flex items-center justify-center shadow-lg group-hover:rotate-12 transition-transform">
                                    <i className="fas fa-leaf text-white text-sm"></i>
                                </div>
                            </div>
                        </div>
                    </div>
                </header>
            );
        };

        const Hero = ({ lang, onPageChange }) => {
            const content = {
                ar: { badge: "ثورة تقنيات الزراعة الذكية", title: "طور مزرعتك بسهولة ", titleSpan: "وكفاءة", sub: "اعثر على أفضل الخدمات والعمال الزراعيين لتنمية مزرعتك وحل المشكلات الميدانية بأمان تام" },
                en: { badge: "Smart Farming Tech Revolution", title: "Develop Your Farm with Ease ", titleSpan: "& Efficiency", sub: "Find the best agricultural services and elite workers to grow your farm and solve field issues safely" }
            };
            const t = content[lang];

            return (
                <section className="relative min-h-[95vh] flex flex-col items-center justify-center py-20 px-6 overflow-hidden">
                    <div className="absolute inset-0 z-0">
                        <img src="https://images.unsplash.com/photo-1500382017468-9049fed747ef?auto=format&fit=crop&q=80&w=2000" className="w-full h-full object-cover brightness-[0.5]" alt="Wheat Field" />
                        <div className="absolute inset-0 bg-gradient-to-b from-black/40 via-transparent to-[#FAF9F6] dark:to-[#0A0F12]"></div>
                    </div>
                    <div className="relative z-10 w-full max-w-6xl text-center text-white space-y-12 animate-fade-in">
                        <div className="inline-flex items-center gap-3 bg-white/10 backdrop-blur-md px-6 py-2 rounded-full border border-white/20">
                            <span className="w-2 h-2 rounded-full bg-[#E07A5F]"></span>
                            <p className="text-[11px] font-black text-white/90 tracking-wider uppercase">{t.badge}</p>
                        </div>
                        <div className="space-y-6">
                            <h1 className="text-6xl md:text-8xl font-black leading-tight drop-shadow-2xl tracking-tighter">{t.title} <span className="text-[#E07A5F]">{t.titleSpan}</span></h1>
                            <p className="text-lg md:text-2xl text-white/80 max-w-3xl mx-auto leading-relaxed font-bold">{t.sub}</p>
                        </div>
                    </div>
                </section>
            );
        };

        const Stats = ({ lang }) => {
            const stats = [
                { num: '5,000+', ar: 'فدان تحت الإدارة', en: 'Acres Managed', icon: 'fa-vector-square' },
                { num: '850+', ar: 'عامل معتمد', en: 'Certified Workers', icon: 'fa-user-check' },
                { num: '120+', ar: 'مزرعة نشطة', en: 'Active Farms', icon: 'fa-tractor' },
                { num: '15+', ar: 'سنة خبرة ميدانية', en: 'Years Experience', icon: 'fa-award' }
            ];
            return (
                <section className="bg-[#0F4C5C] py-20 px-10 relative z-10 mx-6 md:mx-12 rounded-[56px] shadow-2xl border border-white/5 mt-10">
                    <div className="max-w-7xl mx-auto grid grid-cols-2 lg:grid-cols-4 gap-12 text-center relative z-10">
                        {stats.map((s, idx) => (
                            <div key={idx} className="relative group">
                                <div className="mb-6 inline-flex items-center justify-center w-16 h-16 bg-white/5 rounded-[24px] text-[#E07A5F] text-2xl group-hover:scale-110 group-hover:bg-[#E07A5F] group-hover:text-white transition-all duration-500 shadow-xl border border-white/5">
                                    <i className={`fas ${s.icon}`}></i>
                                </div>
                                <p className="text-4xl md:text-6xl font-black text-white mb-3 serif-font tracking-tighter drop-shadow-lg">{s.num}</p>
                                <p className="text-[#E6D5B8] text-[11px] font-black uppercase tracking-[0.2em] opacity-60">{lang === 'ar' ? s.ar : s.en}</p>
                                {idx < stats.length - 1 && <div className={`hidden lg:block absolute top-1/2 ${lang === 'ar' ? '-left-6' : '-right-6'} w-px h-12 bg-white/10 -translate-y-1/2`}></div>}
                            </div>
                        ))}
                    </div>
                </section>
            );
        };

        const WorkerGrid = ({ limit, title, onHireWorker, lang }) => {
            const [activeCategory, setActiveCategory] = React.useState('all');
            const jobsAr = ["سائق جرار", "خبير ري", "حصاد محاصيل", "فني صوبات", "مشرف ميداني", "صيانة معدات", "خبير وقاية نبات", "فني لاندسكيب"];
            const jobsEn = ["Tractor Driver", "Irrigation Expert", "Harvest Specialist", "Greenhouse Tech", "Field Supervisor", "Equipment Maint.", "Plant Protection", "Landscape Tech"];
            const categories = lang === 'ar' ? [{ id: 'all', label: 'الكل' }, ...jobsAr.map(j => ({ id: j, label: j }))] : [{ id: 'all', label: 'All' }, ...jobsEn.map(j => ({ id: j, label: j }))];

            const filteredByCategory = activeCategory === 'all' ? workersData : workersData.filter(w => (lang === 'ar' ? w.job : w.jobEn) === activeCategory);
            const displayedWorkers = limit ? filteredByCategory.slice(0, limit) : filteredByCategory;

            const labels = {
                ar: { hire: "توظيف", chat: "دردشة", perDay: "جنية / يوم", available: "متاح الآن", busy: "في مهمة حالياً", bio: "نبذة عن الكادر:", noResults: "لا يوجد عمال متاحين في هذا التخصص حالياً" },
                en: { hire: "Hire", chat: "Chat", perDay: "LE / Day", available: "Available Now", busy: "In Mission", bio: "About Specialist:", noResults: "No workers available in this category yet" }
            };
            const t = labels[lang];

            return (
                <section className="py-24 px-6 max-w-7xl mx-auto bg-agro-bg transition-colors duration-300">
                    <div className={`flex flex-col items-center justify-center mb-16 gap-10 text-center`}>
                        <div className="space-y-4">
                            <h2 className="text-4xl md:text-5xl font-black text-agro-dark tracking-tight leading-tight">{title}</h2>
                        </div>
                        {!limit && (
                            <div className="flex flex-wrap items-center justify-center gap-3 w-full max-w-5xl animate-fade-in">
                                {categories.map((cat) => (
                                    <button key={cat.id} onClick={() => setActiveCategory(cat.id)} className={`px-6 py-3 rounded-2xl text-[11px] font-black uppercase tracking-wider transition-all duration-300 border shadow-sm ${activeCategory === cat.id ? 'bg-[#E07A5F] text-white border-[#E07A5F] shadow-lg scale-105' : 'bg-agro-card text-agro-text-muted border-gray-100 dark:border-white/5 hover:border-[#E07A5F] hover:text-[#E07A5F] hover:shadow-md'}`}>
                                        {cat.label}
                                    </button>
                                ))}
                            </div>
                        )}
                    </div>
                    {displayedWorkers.length === 0 ? (

                                            <p className="text-[9px] font-black text-agro-text-muted uppercase tracking-widest mb-1 opacity-60">{t.bio}</p>

                                        <div className={`flex flex-wrap gap-4 mb-8 text-xs font-bold text-agro-text-muted border-b border-gray-100 dark:border-white/5 pb-6 ${lang === 'ar' ? 'flex-row-reverse' : ''}`}>

                                        <div className={`flex items-center gap-3 mt-auto ${lang === 'ar' ? 'flex-row' : 'flex-row'}`}>

        const CreateTaskForm = ({ onTaskCreated, initialWorker, lang }) => {
            const [step, setStep] = React.useState(1);
            const [loading, setLoading] = React.useState(false);
            const [isTranslating, setIsTranslating] = React.useState(false);

            const dropdownRef = React.useRef(null);
            const [imagePreview, setImagePreview] = React.useState(null);
            const [workerSearch, setWorkerSearch] = React.useState('');
            const [showWorkerDropdown, setShowWorkerDropdown] = React.useState(false);
            const [errorMsg, setErrorMsg] = React.useState(null);
            const allWorkers = workersData;
            const availableWorkers = allWorkers.filter(w => w.isAvailable);

            const [formData, setFormData] = React.useState({

                priority: 'Normal', vision: '', visionEn: '', startDate: '', endDate: '',

                selectedEquipment: [], safety: { helmet: true, gloves: true, boots: true, vest: true }

            React.useEffect(() => {

            React.useEffect(() => {
                const handleClickOutside = (event) => {

                document.addEventListener('mousedown', handleClickOutside);
                return () => document.removeEventListener('mousedown', handleClickOutside);
            }, []);

            const labels = {
                ar: {
                    mainTitle: 'تخطيط مهمة ميدانية', subtitle: 'أدخل البيانات المطلوبة لبدء العمل الميداني',
                    steps: ['البيانات الأساسية', 'الموارد والجدول', 'التدقيق النهائي'],
                    taskNameLabel: 'اسم المهمة / العملية', taskNamePlaceholder: 'مثال: حصاد القمح - قطاع 4',
                    locationLabel: 'الموقع الميداني (المزرعة)', locationPlaceholder: 'اكتب اسم الموقع هنا...',
                    cropLabel: 'نوع المحصول المستهدف *', cropPlaceholder: 'اختر المحصول...',
                    priorityLabel: 'درجة الاستعجال', urgent: 'عاجلة جداً', normal: 'مهمة عادية',
                    visionLabel: 'وصف المهمة / الرؤية التقنية (ذكاء اصطناعي)', visionPlaceholder: 'صف تفاصيل العملية الميدانية هنا...',
                    addImage: 'أيقونة المهمة', selectWorker: 'قائد الكادر الميداني', workerSearchPlaceholder: 'ابحث عن اسم قائد الفريق...',
                    startDate: 'تاريخ البدء المتوقع', endDate: 'تاريخ الانتهاء المتوقع', workerCount: 'عدد العمال المطلوب', budget: 'الميزانية المرصودة (جنيه)',
                    equipmentTitle: 'تجهيز المعدات والآلات', safetyTitle: 'بروتوكول السلامة الميداني',
                    summaryTitle: 'مراجعة الميزانية والتفاصيل', summaryDesc: 'تأكد من صحة البيانات المالية واللوجستية قبل النشر الميداني',
                    workerWages: 'أجور طاقم العمل الميداني', equipmentRental: 'تكلفة استخدام المعدات', adminFees: 'تأمين ورسوم إدارية', totalAmount: 'إجمالي الميزانية المعتمدة',
                    teamLeader: 'قائد الفريق المسؤول', assignedEquip: 'المعدات المخصصة للمهمة', assignedSafety: 'معدات السلامة المعتمدة', noEquip: 'لم يتم اختيار معدات',
                    submitBtn: 'اعتماد ونشر المهمة', nextBtn: 'حفظ ومتابعة', backBtn: 'رجوع',
                    crops: ["قمح", "أرز", "قطن", "ذرة", "برسيم", "قصب سكر", "بنجر سكر", "موالح", "مانجو", "عنب", "بطاطس", "طماطم", "بصل", "ثوم", "فاصوليا", "عدس", "كتان", "خيار", "فراولة", "تمور"],
                    validationError: "يرجى ملء جميع الحقول المطلوبة قبل المتابعة", translating: "جاري ترجمة البيانات آلياً...",

                    safetyItems: [{ id: 'helmet', icon: 'fa-hard-hat', label: 'خوذة' }, { id: 'gloves', icon: 'fa-mitten', label: 'قفازات' }, { id: 'boots', icon: 'fa-boot', label: 'حذاء' }, { id: 'vest', icon: 'fa-vest', label: 'سترة' }]
                },
                en: {
                    mainTitle: 'Field Task Planning', subtitle: 'Enter details to start the field operation',
                    steps: ['Basic Data', 'Resources', 'Verification'],
                    taskNameLabel: 'Task Name / Operation', taskNamePlaceholder: 'e.g., Grape Harvest - Sector 4',
                    locationLabel: 'Field Location (Farm)', locationPlaceholder: 'Type location name here...',
                    cropLabel: 'Target Crop Type *', cropPlaceholder: 'Select crop...',
                    priorityLabel: 'Priority Level', urgent: 'Urgent', normal: 'Normal',
                    visionLabel: 'Task Description / AI Technical Vision', visionPlaceholder: 'Describe field goals here...',
                    addImage: 'Task Icon', selectWorker: 'Team Leader', workerSearchPlaceholder: 'Search leader name...',
                    startDate: 'Expected Start Date', endDate: 'Expected End Date', workerCount: 'Required Workers Count', budget: 'Allocated Budget (LE)',
                    equipmentTitle: 'Machinery & Equipment', safetyTitle: 'Safety Protocol',
                    summaryTitle: 'Budget & Task Review', summaryDesc: 'Verify financial and logistic details before field publishing',
                    workerWages: 'Field Workforce Wages', equipmentRental: 'Machinery Rental Cost', adminFees: 'Insurance & Admin Fees', totalAmount: 'Total Approved Budget',
                    teamLeader: 'Assigned Team Leader', assignedEquip: 'Task Assigned Equipment', assignedSafety: 'Approved Safety Gear', noEquip: 'No equipment selected',
                    submitBtn: 'Authorize & Publish', nextBtn: 'Save & Continue', backBtn: 'Back',
                    crops: ["Wheat", "Rice", "Cotton", "Maize", "Clover", "Sugar Cane", "Sugar Beet", "Citrus", "Mango", "Grapes", "Potatoes", "Tomatoes", "Onions", "Garlic", "Beans", "Lentils", "Flax", "Cucumber", "Strawberry", "Dates"],

                    safetyItems: [{ id: 'helmet', icon: 'fa-hard-hat', label: 'Helmet' }, { id: 'gloves', icon: 'fa-mitten', label: 'Gloves' }, { id: 'boots', icon: 'fa-boot', label: 'Boots' }, { id: 'vest', icon: 'fa-vest', label: 'Vest' }]
                }
            };

            const t = labels[lang];
            const labelStyles = `text-[18px] font-black text-[#E07A5F] uppercase tracking-wider block mb-3 flex items-center gap-3`;
            const inputStyles = "w-full bg-agro-bg border-2 border-gray-100 dark:border-white/5 rounded-[24px] h-[72px] px-8 focus:ring-[8px] focus:ring-[#E07A5F]/10 focus:border-[#E07A5F] transition-all font-bold text-agro-dark outline-none text-xl placeholder:text-agro-dark/30 shadow-sm";

            const translateData = async () => {
                setIsTranslating(true);
                try {
                    await new Promise(r => setTimeout(r, 1500));
                    setFormData(prev => ({
                        ...prev,
                        titleEn: lang === 'ar' ? prev.title + " (En)" : prev.title,
                        locationEn: lang === 'ar' ? prev.location + " (En)" : prev.location,
                        cropEn: lang === 'ar' ? prev.crop + " (En)" : prev.crop,
                        visionEn: lang === 'ar' ? prev.vision + " (En)" : prev.vision,
                    }));
                } catch (error) {
                    console.error("Translation failed", error);
                } finally {
                    setIsTranslating(false);
                }
            };

            const validateStep = (currentStep) => {
                setErrorMsg(null);
                if (currentStep === 1) {
                    if (!formData.title || !formData.location || !formData.crop || !formData.selectedWorkerId) {
                        setErrorMsg(t.validationError);
                        return false;
                    }
                } else if (currentStep === 2) {
                    if (!formData.startDate || !formData.endDate || formData.budget <= 0) {
                        setErrorMsg(t.validationError);
                        return false;
                    }
                }
                return true;
            };

            const handleNext = async () => {
                if (validateStep(step)) {
                    if (step === 1) await translateData();
                    setStep(prev => Math.min(prev + 1, 3));
                }
            };

            const handleBack = () => {
                setErrorMsg(null);
                setStep(prev => Math.max(prev - 1, 1));
            };

            const selectWorker = (w) => {
                setFormData({ ...formData, selectedWorkerId: w.id });
                setWorkerSearch(lang === 'ar' ? w.name : w.nameEn);
                setShowWorkerDropdown(false);
            };

            const toggleEquipment = (id) => {
                setFormData(prev => ({ ...prev, selectedEquipment: prev.selectedEquipment.includes(id) ? prev.selectedEquipment.filter(item => item !== id) : [...prev.selectedEquipment, id] }));
            };

            const toggleSafety = (id) => {
                setFormData(prev => ({ ...prev, safety: { ...prev.safety, [id]: !prev.safety[id] } }));
            };

            const WorkerCard = ({ w }) => (
                <button onClick={() => selectWorker(w)} className={`w-full flex items-center gap-4 p-4 rounded-[20px] hover:bg-agro-bg transition-all group border-b border-gray-50 dark:border-white/5 ${lang === 'ar' ? 'flex-row' : 'flex-row-reverse'}`}>
                    <img src={w.img} className="w-14 h-14 rounded-xl object-cover ring-2 ring-gray-50 dark:ring-white/5 group-hover:ring-[#E07A5F]" />

                        <p className="text-[10px] font-bold text-agro-text-muted uppercase">{lang === 'ar' ? w.job : w.jobEn}</p>

                    <p className="text-sm font-black text-[#E07A5F]">{w.price} LE</p>
                </button>

            return (
                <div className="max-w-6xl mx-auto px-6 py-6 relative">

                                    <span className={`text-[11px] font-black uppercase tracking-widest ${step === s ? 'text-[#E07A5F]' : 'text-gray-300 dark:text-gray-600'}`}>{t.steps[s - 1]}</span>

                                </div>
                            ))}
                        </div>
                        <div className={`space-y-12 ${lang === 'ar' ? 'text-right' : 'text-left'}`}>
                            {step === 1 && (
                                <div className="animate-fade-in space-y-12">
                                    <div className={`flex flex-col md:flex-row gap-12 items-start ${lang === 'ar' ? 'md:flex-row-reverse' : ''}`}>
                                        <div className="w-full md:w-1/3 space-y-10">
                                            <div className="flex flex-col items-center gap-4">
                                                <div onClick={() => fileInputRef.current?.click()} className="relative group cursor-pointer w-48 h-48 rounded-[40px] border-2 border-dashed border-gray-200 dark:border-white/10 bg-agro-bg flex flex-col items-center justify-center overflow-hidden transition-all hover:border-[#E07A5F] hover:bg-agro-card shadow-sm">
                                                    {imagePreview ? <img src={imagePreview} className="w-full h-full object-cover" /> : <i className="fas fa-camera text-4xl text-gray-300 dark:text-gray-700"></i>}
                                                    <input type="file" ref={fileInputRef} className="hidden" accept="image/*" onChange={(e) => { const file = e.target.files?.[0]; if (file) { const reader = new FileReader(); reader.onloadend = () => setImagePreview(reader.result); reader.readAsDataURL(file); } }} />
                                                </div>
                                                <p className={`text-[11px] font-black uppercase tracking-widest text-agro-text-muted`}>{t.addImage}</p>
                                            </div>
                                            <div className="space-y-3 relative" ref={dropdownRef}>
                                                <label className={labelStyles}><i className="fas fa-user-circle text-2xl"></i> {t.selectWorker} *</label>
                                                <div className="relative">
                                                    <input type="text" className={`w-full bg-agro-bg border-2 rounded-2xl h-[64px] px-6 font-bold text-agro-dark outline-none transition-all text-lg placeholder:text-agro-dark/20 shadow-inner ${errorMsg && !formData.selectedWorkerId ? 'border-red-500/50' : 'border-gray-100 dark:border-white/5 focus:border-[#E07A5F]'}`} placeholder={t.workerSearchPlaceholder} value={workerSearch} onChange={e => { setWorkerSearch(e.target.value); setShowWorkerDropdown(true); }} onFocus={() => setShowWorkerDropdown(true)} />
                                                    {showWorkerDropdown && (
                                                        <div className="absolute top-full left-0 right-0 z-[100] mt-3 bg-agro-card border border-gray-100 dark:border-white/10 rounded-[30px] shadow-2xl max-h-[350px] overflow-y-auto p-2 space-y-1 animate-fade-in custom-scrollbar">
                                                            {availableWorkers.filter(w => (lang === 'ar' ? w.name : w.nameEn).toLowerCase().includes(workerSearch.toLowerCase())).slice(0, 8).map(w => <WorkerCard key={w.id} w={w} />)}
                                                        </div>
                                                    )}
                                                </div>
                                            </div>
                                        </div>
                                        <div className="w-full md:w-2/3 space-y-10">
                                            <div className="space-y-3"><label className={labelStyles}><i className="fas fa-edit text-xl"></i> {t.taskNameLabel} *</label><input type="text" placeholder={t.taskNamePlaceholder} className={`${inputStyles} ${errorMsg && !formData.title ? 'border-red-500/50' : ''}`} value={formData.title} onChange={e => setFormData({ ...formData, title: e.target.value })} /></div>
                                            <div className="space-y-3"><label className={labelStyles}><i className="fas fa-map-pin text-xl"></i> {t.locationLabel} *</label><input type="text" placeholder={t.locationPlaceholder} className={`${inputStyles} ${errorMsg && !formData.location ? 'border-red-500/50' : ''}`} value={formData.location} onChange={e => setFormData({ ...formData, location: e.target.value })} /></div>
                                            <div className="grid grid-cols-1 sm:grid-cols-2 gap-8">
                                                <div className="space-y-3"><label className={labelStyles}><i className="fas fa-leaf text-xl"></i> {t.cropLabel}</label><select className={`${inputStyles} ${errorMsg && !formData.crop ? 'border-red-500/50' : ''}`} value={formData.crop} onChange={e => setFormData({ ...formData, crop: e.target.value })}><option value="">{t.cropPlaceholder}</option>{t.crops.map(c => <option key={c} value={c}>{c}</option>)}</select></div>
                                                <div className="space-y-3"><label className={labelStyles}><i className="fas fa-bolt text-xl"></i> {t.priorityLabel}</label><div className="flex bg-agro-bg rounded-[24px] border-2 border-gray-100 dark:border-white/5 p-1.5 h-[72px] items-center shadow-inner">{[{ key: 'Normal', label: t.normal }, { key: 'Urgent', label: t.urgent }].map(p => (<button key={p.key} onClick={() => setFormData({ ...formData, priority: p.key })} className={`flex-1 h-full rounded-[18px] text-[12px] font-black uppercase transition-all duration-300 ${formData.priority === p.key ? 'bg-agro-card text-[#E07A5F] shadow-sm' : 'text-agro-text-muted hover:text-agro-dark'}`}>{p.label}</button>))}</div></div>
                                            </div>

                            {step === 2 && (

                                <div className="h-40"></div>
                            </div>
                        )}
                        {activePage === 'create' && (
                            <div className="pt-24 min-h-screen">
                                <CreateTaskForm lang={lang} onTaskCreated={handleAddTask} initialWorker={selectedWorkerForTask} />
                                <div className="h-20"></div>
                            </div>
                        )}
                        {activePage === 'tasks' && (
                            <div className="pt-32">
                                <TrackTasks lang={lang} tasks={tasks} onBack={() => handlePageChange('home')} />
                                <div className="h-40"></div>
                            </div>
                        )}
                    </main>
                    <nav className="fixed bottom-10 left-1/2 -translate-x-1/2 z-[100] w-full max-w-2xl px-6 pointer-events-none">
                        <div className="bg-agro-card/95 backdrop-blur-2xl border border-white/40 shadow-xl rounded-[40px] p-2 flex items-center justify-between pointer-events-auto transition-colors duration-300">
                            {[
                                { id: 'home', label: lang === 'ar' ? 'الرئيسية' : 'Home', icon: 'fa-home' },
                                { id: 'create', label: lang === 'ar' ? 'إنشاء مهمة' : 'Create', icon: 'fa-plus' },
                                { id: 'workers', label: lang === 'ar' ? 'كل العمال' : 'Workers', icon: 'fa-user-group' },
                                { id: 'tasks', label: lang === 'ar' ? 'تتبع' : 'Tasks', icon: 'fa-layer-group' }
                            ].map((item) => (
                                <button key={item.id} onClick={() => handlePageChange(item.id)} className={`flex items-center gap-3 px-6 py-4 rounded-[30px] transition-all duration-300 ${activePage === item.id ? 'bg-[#E07A5F] text-white shadow-xl scale-105' : 'text-gray-400 hover:text-[#E07A5F] hover:bg-orange-50 dark:hover:bg-orange-950/30'}`}>
                                    <i className={`fas ${item.icon} text-lg`}></i>
                                    <span className="text-sm font-black whitespace-nowrap hidden sm:inline">{item.label}</span>
                                </button>
                            ))}
                        </div>
                    </nav>
                    <Footer lang={lang} />
                </div>
            );
        };

        // ✅ نخلي React ينتظر Firebase قبل الـ Render
        window.renderApp = function () {
            const root = ReactDOM.createRoot(document.getElementById('root'));
            root.render(<App />);

            // إخفاء شاشة التحميل وإظهار المحتوى
            document.body.classList.remove('hidden');
            document.getElementById('loading-screen').classList.add('hidden');
        };
    </script>

    <script type="module">
        // 🔥 Firebase imports
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // ⚙️ Firebase config
        const firebaseConfig = {
            apiKey: "AIzaSyCg8ej80A4VnHFK2iuXx4nhEt9Wtmf4ulU",
            authDomain: "smart-farm-8d3f5.firebaseapp.com",
            projectId: "smart-farm-8d3f5",
            storageBucket: "smart-farm-8d3f5.appspot.com",
            messagingSenderId: "317371842198",
            appId: "1:317371842198:web:4765ea8c0036ae64b10cb7",
        };

        // 🚀 Init Firebase
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        /* ============================
           🔒 حماية الصفحة حسب الـ Role
        ============================ */
        onAuthStateChanged(auth, async (user) => {
            if (!user) {
                alert('لازم تسجّل دخول الأول');
                window.location.href = './signin.html';
                return;
            }

            try {
                const userRef = doc(db, 'users', user.uid);
                const userSnap = await getDoc(userRef);

                if (!userSnap.exists()) {
                    alert('بيانات المستخدم غير موجودة');
                    window.location.href = './signin.html';
                    return;
                }

                const { role } = userSnap.data();

                // ✅ تخزين الـ Role في المتغير العام
                window.userRole = role;

                // 👷 عامل
                if (role === 'worker') {
                    alert('❌ هذه الصفحة غير متاحة للعمال');
                    window.location.href = 'worker.html';
                    return;
                }

                // 🧑‍🌾 فلاح أو 💼 مستثمر (المسموح لهم)
                else if (role === 'farmer' || role === 'investor') {
                    console.log(`✅ ${role === 'farmer' ? 'فلاح' : 'مستثمر'} – دخول مسموح`);
                    // ✅ تشغيل React بعد التحقق من الصلاحية
                    window.renderApp();
                }

                else {
                    alert('❗ دور غير معروف');
                    window.location.href = './signin.html';
                }

            } catch (error) {
                console.error(error);
                alert('حصل خطأ أثناء التحقق من الصلاحيات');
                window.location.href = './signin.html';
            }
        });
    </script>
</body>


</html>
