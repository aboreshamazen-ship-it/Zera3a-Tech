    <style>
        /* --- CSS Variables & Theming --- */
        :root {
            --agro-teal: #0F4C5C;
            --agro-sand: #E6D5B8;
            --agro-orange: #E07A5F;
            --agro-offwhite: #FAF9F6;
            --agro-green: #5DAE66;
            
            --agro-bg: var(--agro-offwhite);
            --agro-dark: var(--agro-teal);
            --agro-card: #ffffff;
            --agro-text: var(--agro-teal);
            --agro-text-muted: #71717a;
            --agro-border: #E6D5B8;
        }

        html.dark {
            --agro-bg: #0A0F12;
            --agro-dark: #FAF9F6;
            --agro-card: #121A1E;
            --agro-text: #E2E8F0;
            --agro-text-muted: #94a3b8;
            --agro-sand: #2A2F33;
            --agro-border: rgba(255, 255, 255, 0.05);
        }

        body {
            font-family: 'Cairo', sans-serif;
            background-color: var(--agro-bg);
            color: var(--agro-text);
            margin: 0;
            overflow-x: hidden;
            transition: background-color 0.4s cubic-bezier(0.4, 0, 0.2, 1), color 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* --- Utility Classes based on Vars --- */
        .bg-agro-bg { background-color: var(--agro-bg); }
        .bg-agro-card { background-color: var(--agro-card); }
        .bg-agro-teal { background-color: var(--agro-teal); }
        .bg-agro-orange { background-color: var(--agro-orange); }
        .bg-agro-sand { background-color: var(--agro-sand); }

        .text-agro-dark { color: var(--agro-dark); }
        .text-agro-orange { color: var(--agro-orange); }
        .text-agro-teal { color: var(--agro-teal); }
        .text-agro-green { color: var(--agro-green); }
        .text-agro-text-muted { color: var(--agro-text-muted); }
        
        .border-agro-border { border-color: var(--agro-border); }
        .border-agro-orange { border-color: var(--agro-orange); }

        .serif-font {
            font-family: 'Poppins', sans-serif;
        }

        /* --- Animations --- */
        .animate-fade-in {
            animation: fadeIn 0.6s ease-out forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .custom-scrollbar::-webkit-scrollbar {
            width: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: rgba(0,0,0,0.05);
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: var(--agro-teal);
            border-radius: 10px;
        }
        
        /* Selection styling */
        ::selection {
            background-color: #E07A5F;
            color: white;
        }

        /* Hide Scrollbar for horizontal scrolling areas if needed */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        // --- Core Functions ---

        function t(key) {
            const keys = key.split('.');
            let val = translations[state.lang];
            keys.forEach(k => val = val[k]);
            return val || key;
        }

        function toggleTheme() {
            state.darkMode = !state.darkMode;
            document.documentElement.classList.toggle('dark', state.darkMode);
            const icon = document.querySelector('#theme-toggle i');
            if (icon) icon.className = `fas ${state.darkMode ? 'fa-sun' : 'fa-moon'} text-lg`;
        }

        function toggleLang() {
            state.lang = state.lang === 'ar' ? 'en' : 'ar';
            document.documentElement.dir = state.lang === 'ar' ? 'rtl' : 'ltr';
            document.documentElement.lang = state.lang;
            document.getElementById('lang-label').innerText = translations[state.lang].langLabel;
            render();
        }

        function showToast(message, type = 'info') {
            const container = document.getElementById('toast-container');
            const icon = document.getElementById('toast-icon');
            const title = document.getElementById('toast-title');
            const msg = document.getElementById('toast-message');
            const content = document.getElementById('toast-content');

            // Reset classes
            content.className = `relative min-w-[340px] md:min-w-[500px] px-10 py-8 rounded-[40px] shadow-[0_40px_80px_-15px_rgba(0,0,0,0.3)] backdrop-blur-3xl border flex items-center gap-8 overflow-hidden transition-colors duration-500 ${
                type === 'success' ? 'bg-[#0F4C5C]/95 border-[#0F4C5C]/30 text-white' : 
                type === 'warning' ? 'bg-[#E07A5F]/95 border-[#E07A5F]/30 text-white' : 
                'bg-agro-card/95 border-agro-border text-agro-dark'
            }`;
            
            icon.className = `flex-shrink-0 w-16 h-16 rounded-[22px] flex items-center justify-center text-3xl shadow-xl ring-[6px] ring-white/10 ${
                type === 'success' ? 'bg-white text-[#0F4C5C]' : 
                type === 'warning' ? 'bg-white text-[#E07A5F]' : 
                'bg-agro-dark text-agro-card'
            }`;
            
            icon.innerHTML = `<i class="fas ${type === 'success' ? 'fa-check-circle' : type === 'warning' ? 'fa-exclamation-triangle' : 'fa-info-circle'}"></i>`;
            title.innerText = translations[state.lang].toast[type] || type.toUpperCase();
            msg.innerText = message;

            container.classList.remove('opacity-0', '-translate-y-20', 'scale-90');
            container.classList.add('opacity-100', 'translate-y-0', 'scale-100');

            setTimeout(() => {
                container.classList.add('opacity-0', '-translate-y-20', 'scale-90');
                container.classList.remove('opacity-100', 'translate-y-0', 'scale-100');
            }, 4500);
        }

        function setView(viewName) {
            state.view = viewName;
            state.filter = 'all';
            window.scrollTo({ top: 0, behavior: 'smooth' });
            render();
        }

            if (state.myTasks.find(t => t.id === taskId)) return;
            const task = tasksData.find(t => t.id === taskId);
            const newTask = {
                id: task.id, 
                title: task.title, titleEn: task.titleEn, 
                date: "2/5/2026", 
                location: task.location, locationEn: task.locationEn, 
                budget: task.dailyWage.toString(), 
                status: 'pending', 
                crop: task.crop, cropEn: task.cropEn, 
                startTime: '08:00 AM', 
                description: task.description, descriptionEn: task.descriptionEn, 
                teamLeader: 'أحمد محمد', teamLeaderEn: 'Ahmed Mohamed', 
                image: task.image
            };
            state.myTasks.unshift(newTask);
            const msg = state.lang === 'ar' ? 'تم تقديم الطلب بنجاح!\nيمكنك متابعة الحالة من تبويب المتابعة.' : 'Application submitted successfully!\nTrack the status in the Tracking tab.';
            showToast(msg, 'success');
            render(); // Re-render to update buttons
        }

        function acceptRequest(reqId) {
            const reqIndex = state.requests.findIndex(r => r.id === reqId);
            if (reqIndex === -1) return;
            const req = state.requests[reqIndex];
            
            if (req.status === 'accepted') {
                const msg = state.lang === 'ar' ? 'جاري فتح المحادثة المباشرة...' : 'Opening direct chat...';
                showToast(msg, 'info');
                return;
            }

            state.requests[reqIndex].status = 'accepted';
            
            // Add to tasks
            let taskImage = "https://images.unsplash.com/photo-1599423300746-b62533397364?auto=format&fit=crop&q=80&w=600";
            if (req.job.includes("مانجو")) taskImage = "https://i.pinimg.com/736x/42/00/ac/4200ac09886b04bd5d789dbb2149de27.jpg";
            if (req.job.includes("عنب")) taskImage = "https://i.pinimg.com/736x/dd/74/66/dd7466043b67e6b2af8c25de73b115c0.jpg";
            
            const newTask = {
                id: `TSK-${req.id.split('-')[1]}`, 
                title: req.job, titleEn: req.jobEn, 
                date: "2/5/2026", 
                location: state.lang === 'ar' ? "موقع العمل المتعاقد عليه" : "Contracted Worksite", 
                locationEn: "Contracted Worksite", 
                budget: req.budget.toString(), 
                status: 'active', 
                crop: state.lang === 'ar' ? "مهمة خاصة" : "Special Task", 
                cropEn: "Special Task", 
                startTime: '08:00 AM', 
                description: state.lang === 'ar' ? `تم قبول انضمام ${req.workerName} للعمل الميداني.` : `Joined field work.`,
                teamLeader: 'أحمد محمد', teamLeaderEn: 'Ahmed Mohamed', 
                image: taskImage
            };
            state.myTasks.unshift(newTask);

            const name = state.lang === 'ar' ? req.workerName : req.workerNameEn;
            const msg = state.lang === 'ar' ? `تم قبول طلب ${name}\nالمهمة الآن في قسم المتابعة` : `Request from ${name} accepted\nTask moved to Tracking`;
            showToast(msg, 'success');
            render();
        }

        function ignoreRequest(reqId) {
            const reqIndex = state.requests.findIndex(r => r.id === reqId);
            if (reqIndex !== -1) {
                const req = state.requests[reqIndex];
                state.requests.splice(reqIndex, 1);
                const name = state.lang === 'ar' ? req.workerName : req.workerNameEn;
                const msg = state.lang === 'ar' ? `تم تجاهل طلب "${name}"` : `Request from "${name}" ignored`;
                showToast(msg, 'warning');
                render();
            }
        }

        function renderWorkersView() {
            return `
                <div class="pt-32 animate-fade-in">
                    <div class="max-w-7xl mx-auto px-6 mb-12">
                        <div class="text-center mb-10">
                            <p class="text-[#E07A5F] font-black uppercase tracking-[0.4em] text-[10px] mb-2">${state.lang === 'ar' ? 'فرص العمل' : 'Job Opportunities'}</p>
                            <h2 class="text-4xl font-black text-agro-dark">${state.lang === 'ar' ? 'استكشف مهام الميدان' : 'Explore Field Tasks'}</h2>
                        </div>
                    </div>
                    ${renderTaskGridSection(false)}
                    <div class="h-40"></div>
                </div>
            `;
        }

        function renderRequestsView() {
            let filtered = state.requests;
            if (state.filter !== 'all') {
                filtered = state.requests.filter(r => r.status === state.filter);
            }

            return `
                <div class="pt-32 min-h-screen animate-fade-in">
                    <div class="max-w-[1550px] mx-auto px-10 mb-24">
                        <div class="flex flex-col md:flex-row items-center justify-between mb-20 gap-12 ${state.lang === 'ar' ? 'md:flex-row-reverse' : ''}">
                            <div class="${state.lang === 'ar' ? 'text-right' : 'text-left'}">
                                <p class="text-[#E07A5F] font-black uppercase tracking-[0.4em] text-[12px] mb-3">${t('requests.tag')}</p>
                                <h2 class="text-6xl md:text-7xl font-black text-agro-dark tracking-tighter leading-tight">${t('requests.title')} <span class="text-[#E07A5F]">${t('requests.titleSpan')}</span></h2>
                            </div>
                            <div class="flex bg-agro-card/50 backdrop-blur-2xl p-2.5 rounded-[35px] border border-agro-border shadow-xl">
                                ${['all', 'pending', 'accepted'].map(f => `
                                    <button onclick="state.filter='${f}'; render()" 
                                        class="px-12 py-5 rounded-[30px] text-[12px] font-black uppercase tracking-widest transition-all duration-500 ${
                                            state.filter === f ? 'bg-[#0F4C5C] text-white shadow-2xl scale-110' : 'text-agro-text-muted hover:text-[#0F4C5C] hover:bg-agro-bg'
                                        }">
                                        ${f === 'all' ? t('taskGrid.all') : f === 'pending' ? t('tracking.pending') : t('tracking.inProgress')}
                                    </button>
                                `).join('')}
                            </div>
                        </div>
                        
                        ${filtered.length === 0 ? 
                            `<div class="col-span-full py-56 text-center bg-agro-card rounded-[100px] border-4 border-dashed border-agro-border">
                                <p class="text-3xl font-black text-agro-text-muted">${t('requests.empty')}</p>
                            </div>` : 
                            `<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-16">
                                ${filtered.map((req) => {
                                    const isAccepted = req.status === 'accepted';
                                    return `
                                    <div class="bg-agro-card rounded-[80px] shadow-xl border flex flex-col p-14 group transition-all duration-700 relative overflow-hidden ${isAccepted ? 'border-[#0F4C5C]/40 ring-4 ring-[#0F4C5C]/5' : 'border-agro-border'}">
                                        <div class="flex justify-center mb-10">
                                            <div class="px-8 py-3.5 rounded-full text-[12px] font-black uppercase tracking-[0.3em] border shadow-sm ${isAccepted ? 'bg-[#0F4C5C]/10 text-[#0F4C5C] border-[#0F4C5C]/20' : 'bg-agro-bg text-agro-dark border-agro-border'}">
                                                ${state.lang === 'ar' ? req.job : req.jobEn}
                                            </div>
                                        </div>
                                        <div class="flex justify-center mb-10 relative">
                                            <div class="relative group-hover:scale-110 transition-transform duration-700 ease-out">
                                                <img src="${req.workerImg}" class="w-48 h-48 rounded-[60px] object-cover object-center ring-[12px] shadow-2xl transition-all duration-700 ${isAccepted ? 'ring-[#0F4C5C]/20' : 'ring-agro-bg'}" alt="${req.workerName}" />
                                                <div class="absolute -bottom-3 -right-3 w-16 h-16 text-agro-card rounded-[22px] flex items-center justify-center border-[6px] border-agro-card shadow-xl ${isAccepted ? 'bg-agro-dark' : 'bg-[#E07A5F]'}">
                                                    <i class="fas ${isAccepted ? 'fa-comment-dots' : 'fa-check'} text-xl"></i>
                                                </div>
                                            </div>
                                        </div>
                                        <div class="text-center mb-10">
                                            <h3 class="text-5xl font-black mb-5 tracking-tight text-agro-dark group-hover:text-[#E07A5F] transition-colors">${state.lang === 'ar' ? req.workerName : req.workerNameEn}</h3>
                                        </div>
                                        <div class="flex flex-col gap-6 mt-auto">
                                            ${!isAccepted ? `
                                                <button onclick="acceptRequest('${req.id}')" class="w-full h-24 rounded-[35px] font-black text-3xl bg-[#E07A5F] hover:bg-[#0F4C5C] text-white shadow-2xl transition-all duration-500 active:scale-95 flex items-center justify-center gap-5 group/btn ring-4 ring-[#E07A5F]/20">
                                                    <i class="fas fa-user-plus text-xl group-hover/btn:scale-125 transition-transform"></i>${t('requests.accept')}
                                                </button>
                                                <button onclick="ignoreRequest('${req.id}')" class="w-full bg-red-600 hover:bg-red-700 text-white h-20 rounded-[35px] font-black text-base transition-all duration-500 flex items-center justify-center gap-3 shadow-lg shadow-red-600/20 active:scale-95">
                                                    <i class="fas fa-times-circle"></i>${t('requests.ignore')}
                                                </button>
                                            ` : `
                                                <div class="flex items-center justify-between bg-[#0F4C5C]/10 p-6 rounded-[40px] border border-[#0F4C5C]/20">
                                                    <div class="flex items-center gap-4">
                                                        <span class="relative flex h-4 w-4"><span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-[#0F4C5C] opacity-75"></span><span class="relative inline-flex rounded-full h-4 w-4 bg-[#0F4C5C]"></span></span>
                                                        <p class="text-[12px] font-black text-[#0F4C5C] uppercase tracking-[0.1em]">${t('requests.statusMsg')}</p>
                                                    </div>
                                                    <button class="w-20 h-20 bg-[#0F4C5C] text-white rounded-[25px] flex items-center justify-center text-2xl shadow-xl hover:scale-110 transition-all"><i class="fas fa-paper-plane"></i></button>
                                                </div>
                                            `}
                                        </div>
                                    </div>
                                    `;
                                }).join('')}
                            </div>`
                        }
                    </div>
                    <div class="h-20"></div>
                </div>
            `;
        }

        function renderTrackingView() {
            const pendingCount = state.myTasks.filter(t => t.status === 'pending').length;
            const activeCount = state.myTasks.filter(t => t.status === 'active').length;

            return `
                <div class="max-w-[1400px] mx-auto px-6 pt-10 min-h-[70vh] flex flex-col relative animate-fade-in">
                    <div class="flex flex-col md:flex-row justify-between items-start mb-16 gap-8 ${state.lang === 'ar' ? 'md:flex-row-reverse' : ''}">
                        <div class="${state.lang === 'ar' ? 'text-right' : 'text-left'}">
                            <h1 class="text-5xl font-black text-agro-dark mb-2 tracking-tighter">${t('tracking.title')}</h1>
                            <p class="text-agro-text-muted font-bold text-sm">${t('tracking.subtitle')}</p>
                        </div>
                        <div class="flex bg-agro-card rounded-[32px] shadow-sm border border-agro-border p-3 items-center">
                            <div class="px-10 py-2 text-center ${state.lang === 'ar' ? 'border-l' : 'border-r'} border-agro-border">
                                <p class="text-4xl font-black text-[#E07A5F] serif-font leading-none mb-2">${pendingCount}</p>
                                <p class="text-[11px] font-black text-agro-text-muted uppercase tracking-tighter whitespace-nowrap">${t('tracking.pending')}</p>
                            </div>
                            <div class="px-10 py-2 text-center">
                                <p class="text-4xl font-black text-[#0F4C5C] serif-font leading-none mb-2">${activeCount}</p>
                                <p class="text-[11px] font-black text-agro-text-muted uppercase tracking-tighter whitespace-nowrap">${t('tracking.inProgress')}</p>
                            </div>
                        </div>
                    </div>
                    
                    ${state.myTasks.length === 0 ? `
                        <div class="bg-agro-card rounded-[60px] shadow-sm border border-agro-border flex-grow flex flex-col items-center justify-center py-32 px-10 mb-20">
                            <div class="w-40 h-40 rounded-full border-2 border-dashed border-agro-border flex items-center justify-center mb-8">
                                <div class="text-agro-text-muted text-6xl"><i class="fas fa-layer-group"></i></div>
                            </div>
                            <h3 class="text-3xl font-black text-agro-dark mb-10 text-center">${t('tracking.emptyMsg')}</h3>
                            <button onclick="setView('workers')" class="bg-[#E07A5F] hover:bg-[#0F4C5C] text-white px-16 py-5 rounded-[28px] text-lg font-black shadow-2xl transition-all hover:scale-105 active:scale-95">
                                ${t('tracking.browseBtn')}
                            </button>
                        </div>
                    ` : `
                        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-12 mb-32">
                            ${state.myTasks.map(task => renderTaskCard(task, true)).join('')}
                        </div>
                    `}
                </div>
            `;
        }

        // --- Main Render Function ---

        function render() {
            const app = document.getElementById('app-content');
            renderNav();

            // Simple routing logic
            if (state.view === 'home') {
                app.innerHTML = renderHome();
            } else if (state.view === 'workers') {
                app.innerHTML = renderWorkersView();
            } else if (state.view === 'requests') {
                app.innerHTML = renderRequestsView();
            } else if (state.view === 'tasks') {
                app.innerHTML = renderTrackingView();
            }
        }

        // --- Event Listeners ---

        document.getElementById('theme-toggle').addEventListener('click', toggleTheme);
        document.getElementById('lang-toggle').addEventListener('click', toggleLang);
        document.getElementById('home-btn').addEventListener('click', () => setView('home'));

        // Initialize
        render();

    </script>
    <script type="module">
    // 🔥 Firebase imports
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    // ⚙️ Firebase config
    const firebaseConfig = {
        apiKey: "AIzaSyCg8ej80A4VnHFK2iuXx4nhEt9Wtmf4ulU",
        authDomain: "smart-farm-8d3f5.firebaseapp.com",
        projectId: "smart-farm-8d3f5",
        storageBucket: "smart-farm-8d3f5.appspot.com",
        messagingSenderId: "317371842198",
        appId: "1:317371842198:web:4765ea8c0036ae64b10cb7",
    };

    // 🚀 Init Firebase
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    /* ============================
       🔒 حماية الصفحة (للعامل فقط)
    ============================ */
    onAuthStateChanged(auth, async (user) => {
        if (!user) {
            alert('لازم تسجّل دخول الأول');
            window.location.href = './signinsignup/signin.html';
            return;
        }

        try {
            const userRef = doc(db, 'users', user.uid);
            const userSnap = await getDoc(userRef);

            if (!userSnap.exists()) {
                alert('بيانات المستخدم غير موجودة');
                window.location.href = './signinsignup/signin.html';
                return;
            }

            const { role } = userSnap.data();

            // 👷 العامل فقط مسموح
            if (role === 'worker') {
                console.log('✅ عامل – دخول مسموح');
            }

            // 🧑‍🌾 فلاح
            else if (role === 'farmer') {
                alert('❌ هذه الصفحة غير متاحة للفلاحين');
                window.location.href = 'farmer-ar.html';
            }

            // 💼 مستثمر
            else if (role === 'investor') {
                alert('❌ هذه الصفحة غير متاحة للمستثمرين');
                window.location.href = 'investor.html';
            }

            else {
                alert('❗ دور غير معروف');
                window.location.href = './signinsignup/signin.html';
            }

        } catch (error) {
            console.error(error);
            alert('حصل خطأ أثناء التحقق من الصلاحيات');
            window.location.href = './signinsignup/signin.html';
        }
    });

    /* ============================
       🔙 زر العودة حسب الـ Role
    ============================ */
    document.getElementById('home-btn').addEventListener('click', async () => {
        const user = auth.currentUser;
        if (!user) {
            window.location.href = './signinsignup/signin.html';
            return;
        }

        const userRef = doc(db, 'users', user.uid);
        const userSnap = await getDoc(userRef);
        const { role } = userSnap.data();

        if (role === 'worker') {
            window.location.href = 'worker.html';
        } else if (role === 'farmer') {
            window.location.href = 'farmer-ar.html';
        } else if (role === 'investor') {
            window.location.href = 'investor.html';
        } else {
            window.location.href = './signinsignup/signin.html';
        }
    });
</script>
