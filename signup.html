<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>إنشاء حساب | Zera3a-Tech</title>

  <!-- Google Font & Icons -->
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    /* ========== RESET ========== */
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:"Cairo",sans-serif;
    }

    /* ========== COLORS & VARIABLES ========== */
    :root{
      --primary:#0f4c5c;
      --secondary:#e67e5f;
      --bg:#faf9f6;
      --card:#ffffff;
      --border:#e5e7eb;
      --text:#0f172a;
      --muted:#6b7280;
      
      /* Navbar Variables (Added to fix missing vars) */
      --primary-teal:#0f4c5c;
      --action-orange:#e67e5f;
      --text-secondary:#6b7280;
    }

    body{
      background:var(--bg);
      min-height:100vh;
      transition: background 0.3s, color 0.3s;
    }

    /* Dark Mode Overrides */
    body.dark{
      --bg:#0f172a;
      --card:#1e293b;
      --primary:#38bdf8;
      --secondary:#fb923c;
      --text:#f1f5f9;
      --muted:#94a3b8;
      --border:#334155;
      
      /* Dark Navbar Vars */
      --primary-teal:#38bdf8;
      --action-orange:#fb923c;
      --text-secondary:#cbd5e1;
    }

    /* ========== SPLIT LAYOUT ========== */
    .page{
      display:grid;
      grid-template-columns:1fr 1fr;
      min-height:100vh;
    }

    /* ========== TOP NAV BAR ========== */
    .top-nav-bar {
      position: fixed;
      top: 20px;
      z-index: 2000;
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(12px);
      padding: 8px 12px;
      border-radius: 40px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
      border: 1px solid rgba(0,0,0,0.05);
      transition: background 0.3s, border-color 0.3s;
    }

    /* Position adjustments for RTL/LTR */
    html[dir="rtl"] .top-nav-bar { right: 20px; left: auto; }
    html[dir="ltr"] .top-nav-bar { left: 20px; right: auto; }

    body.dark .top-nav-bar {
      background: rgba(30, 41, 59, 0.9);
      border-color: #475569;
    }

    .nav-btn {
      background: transparent;
      border: none;
      cursor: pointer;
      padding: 8px 16px;
      border-radius: 30px;
      font-size: 14px;
      font-weight: 600;
      color: var(--primary-teal);
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.3s;
    }
    .nav-btn:hover { background: rgba(15, 76, 92, 0.1); color: var(--action-orange); }

    .nav-divider { width: 1px; height: 24px; background-color: #ddd; margin: 0 4px; }
    body.dark .nav-divider { background-color: #475569; }

    .control-pill {
      background: transparent;
      border: none;
      cursor: pointer;
      padding: 8px 16px;
      border-radius: 30px;
      font-size: 14px;
      font-weight: 600;
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.3s;
    }
    .control-pill:hover { background: rgba(0,0,0,0.05); color: var(--primary-teal); }
    body.dark .control-pill:hover { background: rgba(255,255,255,0.1); color: white; }

    /* ========== LEFT (FORM) ========== */
    .left{
      display:flex;
      justify-content:center;
      align-items:center;
    }

    .card{
      background:var(--card);
      width:100%;
      max-width:520px;
      padding:50px 45px;
      border-radius:24px;
    }

    .top-links{
      display:flex;
      justify-content:space-between;
      margin-bottom:25px;
      font-size:14px;
      color:var(--muted);
    }

    .title{
      font-size:28px;
      font-weight:800;
      color:var(--primary);
      margin-bottom:6px;
    }

    .subtitle{
      font-size:14px;
      color:var(--muted);
      margin-bottom:30px;
    }

    /* ========== ROLE ========== */
    .roles{
      display:flex;
      gap:12px;
      margin-bottom:30px;
    }

    .role{
      flex:1;
      padding:12px;
      border-radius:999px;
      border:1px solid var(--border);
      background:#f5f5f5;
      text-align:center;
      cursor:pointer;
      font-weight:700;
      color: var(--text);
    }
    body.dark .role { background: #334155; border-color: #475569; }

    .role.active{
      background:var(--primary);
      color:#fff;
      border-color:var(--primary);
    }

    /* ========== FORM ========== */
    form{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:18px;
    }

    .group{
      display:flex;
      flex-direction:column;
    }

    .group.full{
      grid-column:1/3;
    }

    label{
      font-size:13px;
      font-weight:700;
      margin-bottom:6px;
      color:var(--primary);
    }

    input{
      padding:14px 16px;
      border-radius:12px;
      border:1px solid var(--border);
      font-size:15px;
      background: var(--card);
      color: var(--text);
    }

    input:focus{
      outline:none;
      border-color:var(--primary);
    }

    button{
      margin-top:10px;
      padding:16px;
      border:none;
      border-radius:14px;
      background:var(--secondary);
      color:#fff;
      font-size:16px;
      font-weight:800;
      cursor:pointer;
    }
    button:hover { opacity: 0.9; }

    .signin{
      margin-top:25px;
      text-align:center;
      font-size:14px;
    }

    .signin a{
      color:var(--primary);
      font-weight:800;
      text-decoration:none;
    }

    /* ========== RIGHT PANEL ========== */
    .right{
      background:var(--primary);
      color:#fff;
      display:flex;
      flex-direction:column;
      justify-content:center;
      padding:80px;
    }

    .brand{
      font-size:26px;
      font-weight:800;
      margin-bottom:30px;
    }

    .welcome{
      font-size:34px;
      font-weight:800;
      margin-bottom:30px;
    }

    .features{
      list-style:none;
      font-size:16px;
    }

    .features li{
      margin-bottom:14px;
    }

    /* ========== RESPONSIVE ========== */
    @media(max-width:900px){
      .page{ grid-template-columns:1fr; }
      .right{ display:none; }
      form{ grid-template-columns:1fr; }
      .group.full{ grid-column:auto; }
    }
  </style>
</head>

<body>
  
  <!-- TOP NAV -->
  <div class="top-nav-bar">
    <button class="nav-btn" onclick="goBackAction()"><i class="fas fa-arrow-right"></i> <span data-i18n="back-btn">العودة</span></button>
    <button class="nav-btn" onclick="goHome()"><i class="fas fa-home"></i> <span data-i18n="home-btn">الرئيسية</span></button>
    <div class="nav-divider"></div>
    <button class="control-pill" onclick="toggleTheme()"><i class="fas fa-adjust"></i> <span id="themeText" data-i18n="dark-mode">الليلي</span></button>
    <button class="control-pill" onclick="toggleLanguage()"><i class="fas fa-globe"></i> <span id="langText">English</span></button>
  </div>

  <div class="page">
    <!-- RIGHT PANEL -->
    <div class="right">
      <div class="brand">SMART FARM 🌱</div>
      <div class="welcome" data-i18n="hero-title">أهلاً بك في منصة المستقبل</div>
      <ul class="features">
        <li data-i18n="feat-1">✔ إدارة محاصيلك بسهولة</li>
        <li data-i18n="feat-2">✔ وصول مباشر للمستهلكين</li>
        <li data-i18n="feat-3">✔ أمان وشفافية</li>
      </ul>
    </div>
   
    <!-- LEFT PANEL (FORM) -->
    <div class="left">
      <div class="card">
        <h2 class="title" data-i18n="title">إنشاء حساب</h2>
        <p class="subtitle" data-i18n="sub">أدخل بياناتك للمتابعة</p>

        <!-- ROLE SELECTOR -->
        <div class="roles">
          <div class="role active" data-role="farmer" data-i18n="role-farmer">فلاح</div>
          <div class="role" data-role="investor" data-i18n="role-investor">مستثمر</div> <!-- Based on provided text -->
          <div class="role" data-role="worker" data-i18n="role-worker">عامل</div> <!-- Based on provided text -->
        </div>

        <form id="signupForm">
          <input type="hidden" id="roleSelect" value="farmer">

          <div class="group">
            <label data-i18n="lbl-name">الاسم الكامل</label>
            <input type="text" id="fullName" required>
          </div>

          <div class="group">
            <label data-i18n="lbl-phone">رقم الهاتف</label>
            <input type="text" data-i18n-ph="ph-phone">
          </div>

          <div class="group full">
            <label data-i18n="lbl-email">البريد الإلكتروني</label>
            <input type="email" id="email" required data-i18n-ph="ph-email">
          </div>

          <div class="group">
            <label data-i18n="lbl-pass">كلمة المرور</label>
            <input type="password" id="password" required>
          </div>

          <div class="group">
            <label data-i18n="lbl-confirm">تأكيد كلمة المرور</label>
            <input type="password" id="confirmPassword" required>
          </div>

          <div class="group full">
            <button type="submit" data-i18n="btn-submit">إنشاء الحساب</button>
          </div>
        </form>

        <div class="signin">
          <span data-i18n="txt-have-account">لديك حساب بالفعل؟</span> <a href="signin.html" data-i18n="link-signin">تسجيل الدخول</a>
        </div>

      </div>
    </div>
  </div>

<!-- ========== FIREBASE MODULE ========== -->
<script type="module">
/* ================= FIREBASE ================= */
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import {
  getAuth,
  createUserWithEmailAndPassword,
  updateProfile
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import {
  getFirestore,
  doc,
  setDoc,
  serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCg8ej80A4VnHFK2iuXx4nhEt9Wtmf4ulU",
  authDomain: "smart-farm-8d3f5.firebaseapp.com",
  projectId: "smart-farm-8d3f5",
  storageBucket: "smart-farm-8d3f5.appspot.com",
  messagingSenderId: "317371842198",
  appId: "1:317371842198:web:4765ea8c0036ae64b10cb7"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

/* ================= ROLE SELECT ================= */
document.querySelectorAll(".role").forEach(roleEl => {
  roleEl.addEventListener("click", () => {
    document.querySelectorAll(".role").forEach(r => r.classList.remove("active"));
    roleEl.classList.add("active");
    document.getElementById("roleSelect").value = roleEl.dataset.role;
  });
});

/* ================= SIGN UP ================= */
document.getElementById("signupForm").addEventListener("submit", async e => {
  e.preventDefault();

  const role = document.getElementById("roleSelect").value;
  const fullName = document.getElementById("fullName").value;
  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;
  const confirmPassword = document.getElementById("confirmPassword").value;

  if (password !== confirmPassword) {
    alert(translations[currentLang]["err-pass"]);
    return;
  }

  try {
    // إنشاء الحساب
    const cred = await createUserWithEmailAndPassword(auth, email, password);

    // حفظ الاسم في Auth
    await updateProfile(cred.user, {
      displayName: fullName
    });

    // حفظ البيانات في Firestore
    await setDoc(doc(db, "users", cred.user.uid), {
      fullName,
      email,
      role,
      createdAt: serverTimestamp()
    });

    // رسالة ترحيب
    alert(`${translations[currentLang]["welcome"]} ${fullName} 👋`);

    // تحويل حسب الدور
    setTimeout(() => {
      if (role === "farmer") {
        window.location.href = "./farmer-ar.html";
      } else if (role === "investor") {
        window.location.href = "./investor.html";
      } else if (role === "worker") {
        window.location.href = "./worker.html";
      } else {
        window.location.href = "index.html";
      }
    }, 1200);

  } catch (error) {
    alert(error.message);
  }
});
</script>

<script>
/* ================= UI + TRANSLATION ================= */
let currentLang = "ar";
let isDarkMode = false;

const translations = {
  ar: {
    "back-btn": "العودة",
    "home-btn": "الرئيسية",
    "dark-mode": "الليلي",
    "light-mode": "النهاري",
    "title": "إنشاء حساب",
    "sub": "أدخل بياناتك للمتابعة",
    "role-farmer": "فلاح",
    "role-investor": "مستثمر",
    "role-worker": "عامل",
    "lbl-name": "الاسم الكامل",
    "lbl-phone": "رقم الهاتف",
    "lbl-email": "البريد الإلكتروني",
    "lbl-pass": "كلمة المرور",
    "lbl-confirm": "تأكيد كلمة المرور",
    "btn-submit": "إنشاء الحساب",
    "txt-have-account": "لديك حساب بالفعل؟",
    "link-signin": "تسجيل الدخول",
    "hero-title": "أهلاً بك في منصة المستقبل",
    "feat-1": "✔ إدارة محاصيلك بسهولة",
    "feat-2": "✔ وصول مباشر للمستهلكين",
    "feat-3": "✔ أمان وشفافية",
    "ph-phone": "01xxxxxxxx",
    "ph-email": "example@mail.com",
    "err-pass": "كلمتا المرور غير متطابقتين",
    "welcome": "أهلاً"
  },
  en: {
    "back-btn": "Back",
    "home-btn": "Home",
    "dark-mode": "Dark Mode",
    "light-mode": "Light Mode",
    "title": "Create Account",
    "sub": "Enter your details",
    "role-farmer": "Farmer",
    "role-investor": "Investor",
    "role-worker": "Worker",
    "lbl-name": "Full Name",
    "lbl-phone": "Phone Number",
    "lbl-email": "Email",
    "lbl-pass": "Password",
    "lbl-confirm": "Confirm Password",
    "btn-submit": "Create Account",
    "txt-have-account": "Already have an account?",
    "link-signin": "Sign In",
    "hero-title": "Welcome to the Future Platform",
    "feat-1": "✔ Manage crops easily",
    "feat-2": "✔ Direct market access",
    "feat-3": "✔ Secure & Transparent",
    "ph-phone": "01xxxxxxxx",
    "ph-email": "example@mail.com",
    "err-pass": "Passwords do not match",
    "welcome": "Welcome"
  }
};

function toggleTheme() {
  isDarkMode = !isDarkMode;
  document.body.classList.toggle("dark");
  updateThemeText();
}

function toggleLanguage() {
  currentLang = currentLang === "ar" ? "en" : "ar";
  document.documentElement.dir = currentLang === "ar" ? "rtl" : "ltr";

  document.querySelectorAll("[data-i18n]").forEach(el => {
    const key = el.dataset.i18n;
    if (translations[currentLang][key]) {
      el.innerText = translations[currentLang][key];
    }
  });

  document.querySelectorAll("[data-i18n-ph]").forEach(el => {
    const key = el.dataset.i18nPh;
    if (translations[currentLang][key]) {
      el.placeholder = translations[currentLang][key];
    }
  });

  document.getElementById("langText").innerText =
    currentLang === "ar" ? "English" : "العربية";

  updateThemeText();
}

function updateThemeText() {
  const key = isDarkMode ? "light-mode" : "dark-mode";
  document.getElementById("themeText").innerText =
    translations[currentLang][key];
}

function goBackAction() {
  history.back();
}

function goHome() {
  window.location.href = "index.html";
}
</script>


</body>

</html>
