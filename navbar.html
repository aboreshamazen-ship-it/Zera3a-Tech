<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Zera3a-Tech</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Fonts & Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
    body { background: #f8f9fa; color: #000; transition: 0.3s; }

    /* ===== NAVBAR ===== */
    .navbar-main {
      background: #0f4c5c;
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      width: 95%;
      height: 75px;
      border-radius: 30px;
      box-shadow: 0 6px 6px rgba(31, 38, 135, .37);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 30px;
      z-index: 1000;
      transition: 0.3s;
    }

    body.light .navbar-main { background: #fff; box-shadow: 0 6px 6px rgba(0,0,0,0.1); }

    /* LOGO */
    .navbar-logo { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 22px; transition: 0.3s; }
    .navbar-logo img { height: 55px; object-fit: contain; }
    body.light .navbar-logo { color: #0f4c5c; }
    body.dark .navbar-logo { color: #fff; }

    /* CENTER LINKS */
    .navbar-links { list-style: none; display: flex; gap: 18px; align-items: center; }
    .navbar-center { position: absolute; left: 50%; transform: translateX(-50%); }
    .navbar-links a {
      text-decoration: none;
      font-size: 15px;
      padding: 6px 16px;
      border-radius: 20px;
      transition: 0.3s;
      white-space: nowrap;
    }
    body.dark .navbar-links a { color: #fff; }
    body.light .navbar-links a { color: #0f4c5c; }
    .navbar-links a:hover { background: #e07a5f; color: #fff; }

    /* BUTTONS */
    .btn {
      border: 1px solid white;
      background: transparent;
      color: white;
      padding: 6px 12px;
      border-radius: 20px;
      cursor: pointer;
      transition: 0.3s;
    }
    body.light .btn { border-color: #0f4c5c; color: #0f4c5c; }
    .btn:hover { background: #e07a5f; border-color: #e07a5f; color: #fff; }

    /* RIGHT SIDE */
    .navbar-right { z-index: 2; display: flex; align-items: center; gap: 10px; }

    /* USER MENU */
    .user-menu { position: relative; cursor: pointer; }
    .user-name { display: flex; align-items: center; gap: 8px; padding: 6px 14px; border-radius: 20px; transition: 0.3s; }
    .user-name:hover { background: rgba(255,255,255,0.15); }
    body.light .user-name:hover { background: rgba(0,0,0,0.05); }
    .user-dropdown {
      position: absolute; top: 110%; right: 0;
      background: white; min-width: 160px;
      border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.15);
      display: none; flex-direction: column; overflow: hidden; z-index: 1000;
    }
    .user-dropdown a { padding: 12px 15px; color: #333; text-decoration: none; display: flex; gap: 10px; align-items: center; transition: 0.3s; }
    .user-dropdown a:hover { background: #f1f1f1; }

    /* DARK MODE */
    body.dark { background: #1f1f1f; color: #fff; }
    body.dark .navbar-main { background: #0a2e3a; }
    body.dark .btn { border-color: #fff; color: #fff; }
  </style>
</head>

<body>

  <!-- NAVBAR -->
  <div class="navbar-main">

    <!-- LOGO -->
    <div class="navbar-logo" id="navbarLogo">
      <img src="smart_farm_no_bg-removebg-preview.png" alt="Logo">
      <span id="siteName">Zera3a-Tech</span>
    </div>

    <!-- ===== LINKS WHEN USER LOGGED IN ===== -->
    <ul class="navbar-links navbar-center" id="authLinks" style="display:none">
      <li><a href="farmer.html" id="linkMarketplace">Marketplace</a></li>
      <li><a href="animals.html" id="linkAnimals">Animals</a></li>
      <li><a href="wallet.html" id="linkWallet">Wallet</a></li>
      <li><a href="application.html" id="linkCommunity">Community</a></li>
    </ul>

    <!-- ===== LINKS WHEN USER LOGGED OUT ===== -->
    <ul class="navbar-links navbar-center" id="guestLinks" style="display:flex">
      <li><a href="about.html" id="linkAbout">About Us</a></li>
    </ul>

    <!-- RIGHT SIDE -->
    <div class="navbar-right">

      <!-- LANGUAGE + THEME BUTTONS (Always visible) -->
      <button id="langToggle" class="btn">EN</button>
      <button id="themeToggle" class="btn">☀️</button>

      <!-- USER MENU (Only logged in) -->
      <div class="user-menu" id="userMenu" style="display:none">
        <div class="user-name" id="userName">
          <i class="fas fa-user-circle"></i>
          <span>Username</span>
          <i class="fas fa-caret-down"></i>
        </div>

        <div class="user-dropdown" id="userDropdown">
          <a href="./Profile/profile.html" id="profileLink"><i class="fas fa-id-badge"></i> Profile</a>
          <a href="#" id="logoutBtn"><i class="fas fa-sign-out-alt"></i> Logout</a>
        </div>
      </div>

      <!-- SIGN IN BUTTON (Only for guests) -->
      <button id="signInBtn" class="btn" style="display:flex; margin-left:10px;">Sign In</button>

    </div>
  </div>

  <!-- ===== Firebase + Auth Handling ===== -->
    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
      import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

      const firebaseConfig = {
        apiKey: "AIzaSyCg8ej80A4VnHFK2iuXx4nhEt9Wtmf4ulU",
        authDomain: "smart-farm-8d3f5.firebaseapp.com",
        projectId: "smart-farm-8d3f5",
        storageBucket: "smart-farm-8d3f5.appspot.com",
        messagingSenderId: "317371842198",
        appId: "1:317371842198:web:4765ea8c0036ae64b10cb7"
      };

      const app = initializeApp(firebaseConfig);
      const auth = getAuth(app);

      // Elements
      const authLinks = document.getElementById("authLinks");
      const guestLinks = document.getElementById("guestLinks");
      const userMenu = document.getElementById("userMenu");
      const dropdown = document.getElementById("userDropdown");
      const userNameSpan = document.querySelector("#userName span");
      const siteName = document.getElementById("siteName");
      const signInBtn = document.getElementById("signInBtn");

      const navbarLinks = {
        marketplace: document.getElementById("linkMarketplace"),
        animals: document.getElementById("linkAnimals"),
        wallet: document.getElementById("linkWallet"),
        community: document.getElementById("linkCommunity"),
        about: document.getElementById("linkAbout"),
        profile: document.getElementById("profileLink"),
        logout: document.getElementById("logoutBtn")
      };

      // ===== Language Handling =====
      const langBtn = document.getElementById("langToggle");
      let currentLang = localStorage.getItem("lang") || "en";
      let currentUserName = "";

      function updateLanguage(lang) {
        if (lang === "ar") {
          document.documentElement.dir = "rtl";
          document.documentElement.lang = "ar";
          langBtn.textContent = "EN";

          if (navbarLinks.marketplace) navbarLinks.marketplace.textContent = "السوق";
          if (navbarLinks.animals) navbarLinks.animals.textContent = "الحيوانات";
          if (navbarLinks.wallet) navbarLinks.wallet.textContent = "المحفظة";
          if (navbarLinks.community) navbarLinks.community.textContent = "المجتمع";
          if (navbarLinks.about) navbarLinks.about.textContent = "معلومات عنا";

          if (userNameSpan) userNameSpan.textContent = currentUserName || "المستخدم";
          if (navbarLinks.profile) navbarLinks.profile.innerHTML = '<i class="fas fa-id-badge"></i> الملف الشخصي';
          if (navbarLinks.logout) navbarLinks.logout.innerHTML = '<i class="fas fa-sign-out-alt"></i> تسجيل الخروج';

          siteName.textContent = "زراعة تك";
        } else {
          document.documentElement.dir = "ltr";
          document.documentElement.lang = "en";
          langBtn.textContent = "AR";

          if (navbarLinks.marketplace) navbarLinks.marketplace.textContent = "Marketplace";
          if (navbarLinks.animals) navbarLinks.animals.textContent = "Animals";
          if (navbarLinks.wallet) navbarLinks.wallet.textContent = "Wallet";
          if (navbarLinks.community) navbarLinks.community.textContent = "Community";
          if (navbarLinks.about) navbarLinks.about.textContent = "About Us";

          if (userNameSpan) userNameSpan.textContent = currentUserName || "User";
          if (navbarLinks.profile) navbarLinks.profile.innerHTML = '<i class="fas fa-id-badge"></i> Profile';
          if (navbarLinks.logout) navbarLinks.logout.innerHTML = '<i class="fas fa-sign-out-alt"></i> Logout';

          siteName.textContent = "Zera3a-Tech";
        }
      }

      updateLanguage(currentLang);

      langBtn.addEventListener("click", () => {
        currentLang = currentLang === "en" ? "ar" : "en";
        localStorage.setItem("lang", currentLang);
        updateLanguage(currentLang);
      });

      // ===== Theme Handling (Inverted Logic) =====
      const themeBtn = document.getElementById("themeToggle");

      if (localStorage.getItem("theme") === "dark") {
        document.body.classList.add("dark");
        // Dark Mode -> Show Sun (to switch to light)
        themeBtn.textContent = "☀️";
      } else {
        document.body.classList.add("light");
        // Light Mode -> Show Moon (to switch to dark)
        themeBtn.textContent = "🌙";
      }

      themeBtn.addEventListener("click", () => {
        if (document.body.classList.contains("dark")) {
          // Currently Dark -> Switching to Light
          document.body.classList.remove("dark");
          document.body.classList.add("light");
          themeBtn.textContent = "🌙"; // Now it's Light -> Show Moon
          localStorage.setItem("theme", "light");
        } else {
          // Currently Light -> Switching to Dark
          document.body.classList.remove("light");
          document.body.classList.add("dark");
          themeBtn.textContent = "☀️"; // Now it's Dark -> Show Sun
          localStorage.setItem("theme", "dark");
        }
      });

      // ===== Firebase Auth =====
      onAuthStateChanged(auth, (user) => {
        if (user) {
          // Logged In UI
          authLinks.style.display = "flex";
          guestLinks.style.display = "none";
          userMenu.style.display = "block";
          signInBtn.style.display = "none";

          currentUserName = user.displayName || "";
          updateLanguage(currentLang);

          // Toggle dropdown
          document.getElementById("userName").onclick = () => {
            dropdown.style.display = dropdown.style.display === "flex" ? "none" : "flex";
          };

          // Logout with alert + redirect
          document.getElementById("logoutBtn").onclick = async () => {
            try {
              await signOut(auth);
              dropdown.style.display = "none";
              alert("You have successfully logged out. Redirecting to Sign In page...");
              window.location.href = "./signinsignup/signin.html";
            } catch (error) {
              console.error("Logout error:", error);
              alert("Error during logout. Please try again.");
            }
          };

        } else {
          // Logged Out UI
          authLinks.style.display = "none";
          guestLinks.style.display = "flex";
          userMenu.style.display = "none";
          signInBtn.style.display = "flex";
          currentUserName = "";
          updateLanguage(currentLang);

          // Redirect to sign in page on click
          signInBtn.onclick = () => {
            window.location.href = "./signinsignup/signin.html";
          };
        }
      });

      // Close dropdown if clicked outside
      document.addEventListener("click", (e) => {
        if (!userMenu.contains(e.target)) {
          dropdown.style.display = "none";
        }
      });
      
    </script>

</body>
</html>
